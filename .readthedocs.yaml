# .readthedocs.yaml
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
